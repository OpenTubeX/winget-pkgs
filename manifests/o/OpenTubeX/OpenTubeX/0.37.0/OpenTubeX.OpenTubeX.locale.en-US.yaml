ReleaseNotes: |-
  Highlights

  - Navigation, quick settings, player controls and fullscreen actions are now customized on one "Customize interface" page in Appearance settings, with a live preview of each. Its Control bar tab hides and reorders the player's control bar buttons (#1479, #2150)
  - You can now hide AI slop channels with the community-maintained AiSList. Turn on "Hide AI slop channels" under Settings → Add-ons to hide listed channels from search results and recommendations and to tag videos from channels that likely post AI-generated content. (#2155)
  - Added home screen widgets on Android and iOS. Continue watching resumes your latest unfinished videos where you left off, and Quick access opens Search, Subscriptions or Watch Later. (#1603, #2210)
  - Turn on the new bell in a channel's subscribe button to get a system notification when it uploads a video, short, live stream or post. You can choose specific types per channel from the subscribe button's settings menu or in the subscription settings. (#2197)
  - Sort your subscriptions into groups to filter the feed and channel list, and arrange channels in a custom order with drag and drop (#548, #2248)
  - Connect your own Yattee server in Settings → Advanced to load videos, channels, and search results from it and stream videos through it (#1746, #2267)
  - Desktop: Use Custom Title Bar in Theme settings replaces the system title bar with the tab bar, or with the top navigation when tabs are elsewhere, and keeps the window controls in its corner styled for Windows, macOS, Plasma or GNOME (#779, #2258)

  More improvements

  - Choose whether new videos go to the top or bottom of each playlist's custom order from Edit Playlist Info. (#2123, #2124)
  - Android builds now target Android 17 and request Nearby devices permission for local network connections. (#2126)
  - Search keyboard shortcuts by action, section, or key combination. (#2131)
  - Libraries are now stored in SQLite, so editing large playlists and histories saves much faster; your existing library moves over automatically and older versions can still open it (#2128)
  - Arrange your playlists in a custom order with drag and drop, and reorder playlists and their videos with the arrow keys (#1607, #2144)
  - Choose Full Width as the video or playlist view type to show one video per row, and use your Playlist View Type on phones too (#1775, #2147)
  - Long playlists scroll more smoothly, and switching tabs is faster when many tabs are open (#2154)
  - Releases now include signed build provenance, so you can check that a download was built by OpenTubeX's GitHub workflows with gh attestation verify  --repo OpenTubeX/OpenTubeX (#2159)
  - Subscription feeds show new videos while a large refresh is still running instead of waiting until it finishes (#2164)
  - Android APKs are smaller, and new lite APKs of about 15 MiB leave out downloads and other yt-dlp features for devices with little storage (#1604, #2170)
  - Swiping with the Bookmark gesture inside the bookmark playlist now removes the video from it (#2161, #2167)
  - On Android, the app stays more responsive while it syncs and refreshes subscriptions after opening (#2176)
  - Show a privacy warning when an Invidious fallback bypasses your instance and connects directly to YouTube. (#763, #2179)
  - Desktop users can schedule complete local backups to a chosen folder and limit how many backups are kept. (#1661, #2180)
  - The desktop app uses about 55 MB less memory when the tray icon is enabled on Linux and Windows (#2185)
  - Choose how many columns video and playlist grids show, or keep Auto to fit them to the window (#2183)
  - History opens faster with a large watch history, and its channel filter loads channels as you scroll. (#2186)
  - Boost quiet videos up to 200% volume from the player's settings menu after turning on Show Volume Boost Toggle in Playback settings (#1431, #2208)
  - Pair a new device by scanning a code shown on a connected device, so a connected computer without a camera can add a phone (#1829, #2203)
  - On Android, the app opens faster with a large library and stays responsive with many tabs open (#2211)
  - Automatic downloads can wait until your device is charging, or on Android until it is on an unmetered network (#1660, #2206)
  - When Settings or Downloads is moved to the app header, its window now opens out of and closes back into its header button (#2218)
  - On Android, the predictive back gesture now previews going back through pages, dropdowns, context menus, the search bar, the Tab Organizer and the side navigation (#2174, #2214)
  - Pin playlists and channels to the side navigation, or the More menu on phones, to open them from any page (#1671, #2200)
  - On Android, closed-app subscription refreshes skip channels without new content, so the app has less to import when you open it (#2202, #2213)
  - Hide the swipe-to-seek popup with the new "Show swipe-to-seek preview" option in Playback settings while keeping the seek-bar feedback. (#2226, #2236)
  - Fullscreen panels now open as full-width, draggable bottom panels in portrait, including the queue during offline audio playback. (#2231, #2238)
  - Downloads now use compact rows with visible thumbnails, an actions menu, and full file information in Details. (#2229, #2240)
  - Swipe again to reverse queue, Play Next, fully watched, and download actions. These shortcuts also work in Downloads. (#2242, #2244)
  - Choose Google Sans as a bundled app font in Appearance settings. (#2243)
  - Show a second caption track at the same time as the main captions, and keep the auto-translation picked in the player for later videos (#1501, #2217)
  - Watching external media now counts towards your watch statistics (#2221)
  - Save the watch queue to a new or existing playlist, and add a whole playlist to the end of the queue from its playlist page. (#1652, #2247)
  - Dragging a tab to either end of a tab bar with a scrollbar now scrolls the tab bar, so you can drop the tab next to tabs that were out of view. (#2249)
  - Import per-channel playback speeds from the Youtube Speed By Channel userscript under Settings → Data & Storage → Advanced. (#38, #2250)
  - Video cards now show the channel name on its own line, with the view count and upload date below it, each marked with an icon. (#269, #2253)
  - Quick settings can now include 32 more settings, such as Hide Video Views, Hide Live Streams, Reduced Motion, Toast Position, Loop Shorts and Remember Volume (#2222)
  - Choose a preferred video codec in Advanced settings, and switch between a video's codecs in the quality menu for either playback engine. (#2263)
  - Playlist pages now label their main actions and group the rest in a More menu. Custom quick bookmark icons also show in playlist menus instead of a plain circle. (#2261)
  - Turn on Enable Seek History in Playback settings to get back to where you were after a misclicked seek. The player menu lists the positions you jumped away from, and Ctrl+Z and Ctrl+Shift+Z step back and forward through them. (#1453, #2257)
  - Exporting and importing large backups no longer freezes the window, and videos open sooner when the pointer rests on them before the click (#2264)
  - Settings and Downloads open, close, minimize and restore smoothly on slower systems and while the app is busy (#2262)
  - On Android, Settings → Playback → Quality Limit on Metered Networks makes videos start at a lower quality on mobile data and other metered networks (#2268, #2274)
  - The app opens, refreshes subscriptions, loads channels and switches between videos faster (#2277)
  - The buttons below the video are now grouped into one toolbar, with a labeled Download button that shrinks to an icon when space is tight (#2297)
  - Brightness, volume and playback speed swipes now show only their indicator instead of revealing the player controls (#2295, #2296)
  - Turn on diagnostic logging in Settings > Advanced > Diagnostics to copy or save a report for bug reports, with cookies, tokens, IP addresses and URL parameters removed (#2284)
  - Downloaded videos now show a badge on their thumbnails, and opening one plays the downloaded file instead of streaming it. (#2291, #2293)
  - Pinned tabs show their pin as a small badge on the tab icon, which leaves more room for the title (#2308)
  - Settings → Playback → Channel Settings now has one switch that turns channel playback settings on or off instead of one per setting. The other switches save changes automatically. (#2311)
  - Load a local SRT or WebVTT subtitle file for a video from the captions menu (#1657, #2251)
  - Set a playlist to shuffle by default from Edit Playlist Info, so it plays in random order from a random first video. (#2306, #2312)
  - Leaving a video or switching to another tab now shrinks the video into the mini player with the same animation as scrolling past it. (#2318)
  - Video cards now mark music videos with a music note, and music videos opened from lists, the queue or autoplay start at normal speed (#2320)
  - Each playlist now remembers its own sort order, and encrypted sync carries it to your other devices. (#2323)

  Fixed bugs

  - Fixed the missing OpenTubeX app icon on macOS. (#2116)
  - Clearing a channel search right after submitting it no longer reloads the channel and resets its sort order. (#2118)
  - Fixed the oversized tray icon in the macOS menu bar. (#2117)
  - Made quick Ctrl+Tab and Ctrl+Shift+Tab switches skip menu rendering and preview loading. Holding Control still opens the tab switcher. (#2129)
  - Resume at the current playback position when opening a video tab on another device, even before watch history syncs. (#2133)
  - Fix clipped page previews while swiping into the mobile tab organizer and animate opening it by tapping its button. (#2135)
  - Tap the mobile audio player to hide or show its controls. (#2139)
  - Fixed stuck channel search spinners, repeated watched-history writes, stale sync history paging and cached image errors, and made comment filtering, tab updates and yt-dlp playback start faster. (#2136)
